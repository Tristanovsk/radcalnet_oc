# Default configuration of radcalnet_oc.
#
# Do not edit this file: write the settings to change in your user configuration file,
# ~/.config/radcalnet_oc/config.yml (create it with `radcalnet_oc_config --init [/path/to/lut]`). Only
# the keys that differ from these defaults are needed. Print the configuration in use with
# `radcalnet_oc_config`.

path:
  # folder of the TOA look-up table (LUT); also set by the environment variable RADCALNET_OC_DATA_ROOT;
  # null: default folder of the user data, ~/.local/share/radcalnet_oc/lut on Linux (see
  # `radcalnet_oc_config`). The LUT is the one of GRS: a GRS LUT folder can be used as is
  lutdata: null
  # TOA LUT file name, in lutdata (download it with `radcalnet_oc_config --download`)
  toa_lut: 'toa_lut_opac_wind_v3.nc'
  # irradiance transmittance LUT, shipped with the package (radcalnet_oc/data/lut/atmo)
  trans_lut: 'transmittance_lut_opac_wind_v3.nc'
  cams: '/data/cams'

# Zenodo record of the TOA LUT (dataset shared with GRS, https://doi.org/10.5281/zenodo.23394202), used
# by `radcalnet_oc_config --download`
zenodo:
  url: 'https://zenodo.org'
  record: 23394202
  # download the missing TOA LUT automatically when the LUTs are loaded (also switched off by the
  # environment variable RADCALNET_OC_NO_DOWNLOAD=1, e.g. without internet access); without the TOA LUT,
  # the light LUT of the package is used, with a lower accuracy
  auto_download: true

settings:
  aerosol_combination: [0, 0.5, 0, 0.5, 0.,0.]
  aerosol_models: ['ARCT_rh70', 'COAV_rh70', 'DESE_rh70', 'MACL_rh70', 'URBA_rh70', 'WASO_rh0']
  # wind speed (m s-1) of the sea-surface roughness when the input has no 'wind' variable (or for its
  # missing values); the LUTs are interpolated between their wind nodes (0.5-16 m s-1)
  wind: 2.
  # absorption of O2: 'lbl' (line by line in the O2-B and O2-A bands, 683-702 and 755-775 nm; default, closer
  # to the CKD of the coupling fit and needed at sub-nanometre resolution, e.g. FLEX) or 'reptran' (REPTRAN
  # fine table, as for the other gases; as before version 1.1)
  o2_model: 'lbl'
  # gaseous transmittance of the scattered light in the O2 and H2O bands of 684-990 nm (radcalnet_oc.kernel.GasCoupling):
  # 'path_length' (photon path-length model, channel by channel; default), 'effective_air_mass' (effective air
  # masses per absorption window, computed at 5 cm-1) or 'decoupled' (air mass of the direct beam for all the
  # terms, as before version 1.1)
  gas_coupling: 'path_length'
  # remote-sensing reflectance beyond the spectral range of the input (e.g. above 1150 nm): 'pure_water'
  # (semi-analytical model with the absorption of pure water, particulate backscattering fitted on the
  # near-infrared end of the input; default) or 'zero' (as before version 1.1)
  rrs_extension: 'pure_water'
  # scaling of the Rayleigh scattering of the look-up tables (OSOAA runs at 1015.2 hPa) with the surface pressure of
  # each measurement: path reflectance and diffuse transmittances (Process.rayleigh_pressure_correction, validated
  # with OSOAA runs at +/- 20 hPa); true by default, false as before version 1.2
  rayleigh_pressure: true

processor:
  ncpu: 8
  chunk: 512
  netcdf_engine: 'netcdf4'
