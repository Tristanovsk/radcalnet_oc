# Default configuration of radcalnet_oc.
#
# Do not edit this file: write the settings to change in your user configuration file,
# ~/.config/radcalnet_oc/config.yml (create it with `radcalnet_oc_config --init [/path/to/lut]`). Only
# the keys that differ from these defaults are needed. Print the configuration in use with
# `radcalnet_oc_config`.

path:
  # folder of the TOA look-up table (LUT); also set by the environment variable RADCALNET_OC_DATA_ROOT;
  # null: default folder of the user data, ~/.local/share/radcalnet_oc/lut on Linux (see
  # `radcalnet_oc_config`). The LUT is the one of GRS: a GRS LUT folder can be used as is
  lutdata: null
  # TOA LUT file name, in lutdata (download it with `radcalnet_oc_config --download`)
  toa_lut: 'toa_lut_opac_wind_v3.nc'
  # irradiance transmittance LUT, shipped with the package (radcalnet_oc/data/lut/atmo)
  trans_lut: 'transmittance_lut_opac_wind_v3.nc'
  cams: '/data/cams'

# Zenodo record of the TOA LUT (dataset shared with GRS, https://doi.org/10.5281/zenodo.23394202), used
# by `radcalnet_oc_config --download`
zenodo:
  url: 'https://zenodo.org'
  record: 23394202
  # download the missing TOA LUT automatically when the LUTs are loaded (also switched off by the
  # environment variable RADCALNET_OC_NO_DOWNLOAD=1, e.g. without internet access); without the TOA LUT,
  # the light LUT of the package is used, with a lower accuracy
  auto_download: true

settings:
  aerosol_combination: [0, 0.5, 0, 0.5, 0.,0.]
  aerosol_models: ['ARCT_rh70', 'COAV_rh70', 'DESE_rh70', 'MACL_rh70', 'URBA_rh70', 'WASO_rh0']

processor:
  ncpu: 8
  chunk: 512
  netcdf_engine: 'netcdf4'
