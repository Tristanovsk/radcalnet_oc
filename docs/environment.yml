name: radcalnet_oc
channels:
  - conda-forge
dependencies:
  - python=3.12
  - xarray
  - netcdf4
  - h5netcdf
  - zarr
  - dask
  - pip>=20.1  # pip is needed as dependency
  - pip:
    - jupyter
    - importlib_resources
    - xmltodict
    - docopt
    - numba
    - numpy
    - scipy
    - pandas>=2.0.3
    - pyyaml
    - -r requirements.txt
